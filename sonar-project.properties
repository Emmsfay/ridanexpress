# ── SonarQube Project Configuration ───────────────────────────
# This file is read automatically by npx sonar-scanner
# No need to pass -D flags in the Jenkinsfile

# Project identification
sonar.projectKey=ridanexpress
sonar.projectName=Ridan Express
sonar.projectVersion=1.0

# Source code location
sonar.sources=src

# Exclude files that don't need scanning
sonar.exclusions=**/node_modules/**,**/build/**,**/*.test.js,**/*.spec.js

# Test coverage report (generated by Jest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
